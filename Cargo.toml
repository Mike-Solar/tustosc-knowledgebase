[workspace]
resolver = "3"
members = ["apps/server", "crates/migration"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/TUST-Open-Source-Club/knowledgebase"

[workspace.dependencies]
sea-orm = { version = "2.0.4", features = [
    "sqlx-postgres",
    "sqlx-mysql",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }
sea-orm-migration = { version = "2.0.4", features = [
    "sqlx-postgres",
    "sqlx-mysql",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "with-chrono",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
