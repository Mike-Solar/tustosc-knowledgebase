# 本地开发数据库：默认 PostgreSQL；MySQL 需要显式启用 profile：
#   docker compose up -d                  # 只启动 PostgreSQL
#   docker compose --profile mysql up -d  # 同时启动 MySQL
services:
  postgres:
    image: postgres:17-alpine
    container_name: knowledgebase-postgres
    environment:
      POSTGRES_DB: knowledgebase
      POSTGRES_USER: knowledgebase
      POSTGRES_PASSWORD: knowledgebase
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgebase -d knowledgebase"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: knowledgebase-mysql
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: knowledgebase
      MYSQL_USER: knowledgebase
      MYSQL_PASSWORD: knowledgebase
      MYSQL_ROOT_PASSWORD: knowledgebase
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uknowledgebase", "-pknowledgebase"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  mysql-data:
